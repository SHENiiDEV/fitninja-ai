services:
  # PHP-FPM Application Server
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fitninja-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    networks:
      - fitninja
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: fitninja-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - fitninja
    depends_on:
      - app

  # MySQL Database
  mysql:
    image: mysql:8.4
    container_name: fitninja-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: fitninja
      MYSQL_USER: fitninja
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - fitninja
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis (Queues, Cache, Sessions)
  redis:
    image: redis:alpine
    container_name: fitninja-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - fitninja

  # Queue Worker (processes Telegram messages asynchronously)
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fitninja-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    volumes:
      - .:/var/www/html
    networks:
      - fitninja
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  mysql_data:

networks:
  fitninja:
    driver: bridge
